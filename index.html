<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090f" />
  <meta name="description" content="ZUNO AI — مساحة عملك الذكية." />
  <title>ZUNO AI — Intelligence Without Limits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#"><span class="brand-mark">Z</span><span>ZUNO <b>AI</b></span></a>
      <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
      <div class="side-label">مساحة العمل</div>
      <button class="nav-item active">✧ <span>المساعد الذكي</span></button>
      <button class="nav-item">⌘ <span>إنشاء موقع</span><em>قريباً</em></button>
      <button class="nav-item">▧ <span>الملفات والصور</span><em>قريباً</em></button>
      <button class="nav-item">◷ <span>المحادثات</span></button>
      <div class="sidebar-bottom"><div class="avatar">N</div><div><strong>حساب ZUNO</strong><small>مساحة شخصية</small></div><span class="settings">⚙</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="menu" id="menuBtn" aria-label="القائمة">☰</button><span class="top-title">المساعد الذكي</span><div class="top-actions"><span class="status-dot"></span><span>نسخة تجريبية</span></div></header>
      <section class="workspace">
        <div class="welcome" id="welcome">
          <div class="spark">✳</div>
          <p class="eyebrow">مرحباً بك في عالم ZUNO</p>
          <h1>خلّ أفكارك<br><span>تصير واقع.</span></h1>
          <p class="subtitle">اسأل، ابتكر، خطّط، وابنِ شيئاً جديداً. نقطة البداية من هنا.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="ساعدني في بناء فكرة مشروع رقمي ناجح">✦ <span>ابتكر فكرة مشروع</span></button>
            <button class="suggestion" data-prompt="اكتب لي خطة واضحة لتعلم البرمجة">⌘ <span>خطط لتعلم البرمجة</span></button>
            <button class="suggestion" data-prompt="ساعدني في كتابة محتوى احترافي لموقعي">✎ <span>اكتب محتوى لموقعي</span></button>
            <button class="suggestion" data-prompt="حلل هذه الفكرة واقترح تحسينات عليها">◈ <span>طوّر فكرة عندي</span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="اكتب سؤالك أو فكرتك هنا..." aria-label="اكتب رسالتك"></textarea>
          <div class="composer-bottom"><div class="composer-hint">ZUNO قد يخطئ أحياناً؛ راجع المعلومات المهمة.</div><button class="send" type="submit" aria-label="إرسال">↑</button></div>
        </form>
        <footer>صُنع ليمنح أفكارك مساحة أكبر <span>✳ ZUNO AI</span></footer>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
